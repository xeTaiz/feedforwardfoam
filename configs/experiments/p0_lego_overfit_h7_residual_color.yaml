seed: 7
output_dir: runs/p0_lego_overfit_h7_residual_color
backbone:
  checkpoint: null
  image_resolution: 160
  allow_stub_backbone: false
head:
  grid_stride: 1
  max_cells: 25600
  num_texel_sites: 8
  spherical_voronoi_dof: 8
  hidden_dim: 256
  radius_mode: pixel_footprint
  radius_scale_init: 0.8
  radius_residual_log_scale: 0.0
  density_mode: fixed
  fixed_density: 1000000.0
  initialize_rgb_from_image: false
  initialize_normals_from_depth: false
  base_depth_mode: constant
  constant_base_depth: 2.0
  point_residual_scale: 0.0
  normal_residual_radians: 0.0
  rgb_residual_scale: 1.0
renderer:
  render_objective: volume
  is_pinhole: true
  bkgd_color: [0.0, 0.0, 0.0]
data:
  context_views: 1
  target_views: 1
  min_overlap: 0.7
  image_downsample: 5
train:
  steps: 1000
  batch_size: 1
  learning_rate: 0.0001
  weight_decay: 0.0
  rgb_loss: mse
  log_every: 5
  validate_every: 5
  resample_episodes: false
  target_from_context: true
  alpha_loss_weight: 0.0
