seed: 17
output_dir: runs/p0_scannetpp_1ctx_control
backbone:
  checkpoint: null
  image_resolution: 80
  allow_stub_backbone: false
head:
  max_cells: 6400
  num_texel_sites: 8
  spherical_voronoi_dof: 8
  hidden_dim: 256
  radius_mode: pixel_footprint
  radius_scale_init: 1.25
  radius_residual_log_scale: 0.25
  density_mode: fixed
  fixed_density: 10000.0
  initialize_rgb_from_image: true
  initialize_normals_from_depth: true
  base_depth_mode: predicted
  point_residual_scale: 0.02
  normal_residual_radians: 0.25
  rgb_residual_scale: 1.0
  fusion_mode: none
renderer:
  render_objective: volume
  is_pinhole: true
  bkgd_color:
  - 0.0
  - 0.0
  - 0.0
data:
  dataset: scannetpp
  scene_manifest: data/manifests/scannetpp_p0_4scene.json
  context_views: 1
  target_views: 1
  target_pool_size: 24
  image_downsample: 1
train:
  steps: 2000
  learning_rate: 0.0001
  weight_decay: 0.0
  rgb_loss: mse
  alpha_loss_weight: 0.0
  log_every: 10
  validate_every: 200
  checkpoint_every: 200
  validation_episodes: 8
  resample_episodes: true
  target_from_context: false
  visibility_mask: false
  visibility_mask_dilation: 2
