# Frozen VGGT-Ω -> canonical-view full Power Foam smoke experiment.
seed: 7
output_dir: runs/p0_blender_smoke
backbone:
  checkpoint: null  # Set to the gated VGGT-Omega-1B-512 checkpoint.
  # NeRF-Synthetic frames are 800²; 800 / 5 = 160, divisible by VGGT-Ω's 16px patch size.
  image_resolution: 160
  allow_stub_backbone: false
head:
  grid_stride: 16
  max_cells: 1024
  num_texel_sites: 8
  spherical_voronoi_dof: 8
  hidden_dim: 256
renderer:
  render_objective: volume
  is_pinhole: true
  bkgd_color: [0.0, 0.0, 0.0]
data:
  context_views: 1
  target_views: 1
  min_overlap: 0.7
  image_downsample: 5
train:
  steps: 500
  batch_size: 1
  learning_rate: 0.0003
  rgb_loss: charbonnier
  log_every: 10
  validate_every: 100
  # Keep one context/held-out-target pair fixed for the initial convergence smoke.
  resample_episodes: false
  # Kept false for NVS. Enable only for a same-view renderer-gradient smoke.
  target_from_context: false
