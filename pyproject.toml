[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "feedforwardfoam"
version = "0.1.0"
description = "Feed-forward Power Foam reconstruction research harness"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.3",
  "torchvision>=0.18",
  "numpy<2",
  "Pillow>=10",
  "PyYAML>=6",
  "tqdm>=4.66",
  "scikit-image>=0.23",
  "lpips>=0.1.4",
]

[project.optional-dependencies]
powerfoam = [
  "warp-lang==1.10.0",
  "scipy>=1.11",
  "pycolmap>=3.10",
  "open3d>=0.19",
]
gsplat = [
  "gsplat==1.5.3",
]
dev = ["pytest>=8", "ruff==0.15.0"]

[project.scripts]
fffoam-train = "feedforwardfoam.train:main"
fffoam-prepare-scannetpp = "feedforwardfoam.data.scannetpp:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "integration: requires CUDA plus the Power Foam subrepository and its dependencies",
]

[tool.ruff]
line-length = 100
target-version = "py310"
